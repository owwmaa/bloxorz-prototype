<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloxorz Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="homeScreen" class="screen active">
    <svg class="logoIcon" width="50" height="64" viewBox="0 0 100 125">
      <polygon points="50,8 92,30 50,52 8,30" fill="#4a7de8"/>
      <polygon points="8,30 50,52 50,117 8,95" fill="#2a4fa0"/>
      <polygon points="92,30 50,52 50,117 92,95" fill="#1f3a80"/>
    </svg>
    <h1>Blox Prototype</h1>
    <div class="menuButtons">
      <button id="newGameBtn" class="primaryBtn">Start New Game</button>
      <button id="continueBtn" class="primaryBtn">Continue</button>
      <button id="levelsBtn" class="primaryBtn">Levels</button>
      <button id="editorBtn" class="primaryBtn">Level Editor</button>
      <button id="feedbackBtn" class="primaryBtn">Feedback</button>
    </div>
  </div>

  <div id="levelSelectScreen" class="screen">
    <h1>Select a Level</h1>
    <div id="levelGrid"></div>
    <button id="backFromLevelsBtn" class="ghostBtn">← Back</button>
  </div>

  <div id="editorScreen" class="screen">
    <h1>Level Editor</h1>
    <div id="editorSizeRow">
      <label>Rows <input type="number" id="editorRowsInput" value="8" min="1" max="20"></label>
      <label>Cols <input type="number" id="editorColsInput" value="12" min="1" max="20"></label>
      <button id="editorResizeBtn" class="ghostBtn">Resize</button>
    </div>
    <div id="editorToolbar">
      <button class="toolBtn active" data-tool="floor">Floor</button>
      <button class="toolBtn" data-tool="void">Erase</button>
      <button class="toolBtn" data-tool="weak">Weak</button>
      <button class="toolBtn" data-tool="goal">Goal</button>
      <button class="toolBtn" data-tool="start">Start</button>
      <button class="toolBtn" data-tool="switchO">Switch O</button>
      <button class="toolBtn" data-tool="switchX">Switch X</button>
      <button class="toolBtn" data-tool="switchOpen">Open-only</button>
      <button class="toolBtn" data-tool="switchClose">Close-only</button>
    </div>
    <div id="editorHint"></div>
    <div id="editorGrid"></div>
    <div id="editorActions">
      <button id="editorTestBtn" class="primaryBtn">Test Play</button>
      <button id="editorExportBtn" class="primaryBtn">Export</button>
      <button id="editorClearBtn" class="ghostBtn">Clear</button>
    </div>
    <textarea id="editorExportOutput" rows="8" readonly></textarea>
    <div id="editorMessage"></div>
    <button id="backFromEditorBtn" class="ghostBtn">← Back</button>
  </div>

  <div id="feedbackScreen" class="screen">
    <h1>Feedback</h1>
    <iframe id="feedbackFrame"
      src="https://docs.google.com/forms/d/e/1FAIpQLSf_nRNwVNk8-BLihslbTvUaWXIpXV4xH4hpgrI9hcrQbOxdHw/viewform?embedded=true">
    </iframe>
    <button id="backFromFeedbackBtn" class="ghostBtn">← Back</button>
  </div>

  <div id="app" class="screen">
    <div id="hud">
      <button id="menuBtn">☰</button>
      <span id="levelLabel">Level 1 / 3</span>
      <span id="movesLabel">Moves: 0</span>
      <button id="restartBtn">Restart ↺</button>
      <button id="skipBtn">Skip level →</button>
    </div>
    <div id="playArea">
      <canvas id="board"></canvas>
      <div id="winFlash"></div>
      <div id="winBanner"><div class="winBannerText"></div></div>
    </div>
    <div id="message"></div>
    <button id="feedbackPromptBtn" class="primaryBtn" style="display:none">Give Feedback</button>
  </div>

  <div id="introOverlay">
    <div class="overlayBox">
      <p>This game uses an isometric camera — swipe <b>diagonally</b>, matching the
      direction the block actually rolls on screen:</p>
      <div class="swipeDiagram">
        <div class="swipeArrow ul">↖<span>Left</span></div>
        <div class="swipeArrow ur">↗<span>Up</span></div>
        <div class="swipeArrow dl">↙<span>Down</span></div>
        <div class="swipeArrow dr">↘<span>Right</span></div>
      </div>
      <p>Land <b>standing upright</b> on the glowing tile to win.</p>
      <button id="dismissIntroBtn" class="primaryBtn">Got it</button>
    </div>
  </div>

  <script src="levels.js"></script>
  <script src="game.js"></script>
  <script src="menu.js"></script>
  <script src="editor.js"></script>
</body>
</html>
